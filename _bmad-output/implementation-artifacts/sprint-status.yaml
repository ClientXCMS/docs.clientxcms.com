# Project: docs.clientxcms.com
# Branch: feat/i18n
# Remote: alexwrite/docs.clientxcms.com

# WORKFLOW FOR PARALLEL INSTANCES:
# ================================
# 1. Read this file, find first "ready-for-dev" story with owner: null
# 2. Claim it by setting owner: "<your-instance-id>" and status: in-progress
# 3. Commit claim: git commit -m "claim: <story-id>"
# 4. git push (with pull --rebase if needed)
# 5. Execute translation: FR -> EN in docs/, keep FR in i18n/fr/
# 6. Run /code-review
# 7. Commit translation: git commit -m "docs(i18n): translate <filename>"
# 8. Update status: done, push
# 9. Loop to step 1

# TRANSLATION RULES:
# ==================
# - Source: docs/<path>.md (currently FR, translate to EN)
# - Mirror: i18n/fr/docusaurus-plugin-content-docs/current/<path>.md (keep FR)
# - Add frontmatter: translated: true
# - Keep technical terms, variable names, code blocks unchanged
# - Maintain admonition format (:::tip, :::warning, etc.)

# STATUS DEFINITIONS:
# ===================
# ready-for-dev: Available for claiming
# in-progress: Claimed by an instance
# review: Translation done, pending review
# done: Completed and merged

